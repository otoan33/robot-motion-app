# robot-viser-app（backend :8000 / viser :8081）を先に起動しておく前提。ポートは robot-viser-app と重ならないようにずらしている
services:
  backend:
    build: ./backend
    # オフラインでも起動できるよう、python イメージをレジストリに取りに行かない
    pull_policy: never
    ports:
      - "8100:8100"
    environment:
      # 障害物回避で robot-viser-app の距離計算 API（/distances）を使う
      VISER_API_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # COPY したコードをホスト側で上書きし、コード変更のたびにビルドしなくて済むようにする
    volumes:
      - ./backend:/app/backend
    # 保存したコードを自動で再読み込みする
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    pull_policy: never
    ports:
      - "8180:8180"
    environment:
      BACKEND_URL: http://backend:8100
      # 別の compose で起動した robot-viser-app の API へ、ホスト経由で接続する
      VISER_API_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # コード変更は docker compose restart frontend で反映する
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend
    restart: unless-stopped
